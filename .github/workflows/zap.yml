name: OWASP ZAP DAST

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    name: ZAP Baseline Security Scan
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: books_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d books_api_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: books_api_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_ISSUER: books-api
      JWT_AUDIENCE: books-api-client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize PostgreSQL
        run: |
          PGPASSWORD="$DB_PASSWORD" psql \
            -h "$DB_HOST" \
            -p "$DB_PORT" \
            -U "$DB_USER" \
            -d "$DB_NAME" \
            -v ON_ERROR_STOP=1 \
            -f db/migrations/001_create_books.sql

      - name: Start Books API
        run: |
          node server.js > /tmp/books-api-zap.log 2>&1 &
          echo $! > /tmp/books-api-zap.pid

          for i in $(seq 1 30); do
            status=$(curl --noproxy '*' -s -o /dev/null -w '%{http_code}' \
              http://127.0.0.1:3000/api/books || true)

            if [ "$status" = "401" ]; then
              echo "Books API is ready."
              exit 0
            fi

            if ! kill -0 "$(cat /tmp/books-api-zap.pid)" 2>/dev/null; then
              break
            fi

            sleep 1
          done

          cat /tmp/books-api-zap.log
          exit 1

      - name: Run authenticated OWASP ZAP baseline scan
        run: |
          set -euo pipefail

          mkdir -p zap-reports
          chmod 777 zap-reports

          # Generate a short-lived reader token without printing it.
          token="$(node scripts/createToken.js reader)"
          echo "::add-mask::$token"

          # Verify the token works before starting ZAP.
          status="$(curl --noproxy '*' -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            http://127.0.0.1:3000/api/books)"

          if [ "$status" != "200" ]; then
            echo "Authenticated API readiness check failed: HTTP $status"
            exit 1
          fi

          # Pass the token directly into ZAP's container environment.
          # Avoid writing the token into tracked files or reports.
          export ZAP_AUTH_HEADER_VALUE="Bearer $token"

          docker run --rm \
            --network host \
            --env ZAP_AUTH_HEADER=Authorization \
            --env ZAP_AUTH_HEADER_VALUE \
            --env ZAP_AUTH_HEADER_SITE=http://127.0.0.1:3000 \
            -v "$PWD/zap-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:3000/api/books \
            -m 1 \
            -I \
            -r zap-report.html \
            -J zap-report.json

          unset token ZAP_AUTH_HEADER_VALUE

      - name: Upload ZAP security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-zap-security-report
          path: zap-reports/
          if-no-files-found: warn

      - name: Upload API logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zap-api-logs
          path: /tmp/books-api-zap.log
          if-no-files-found: ignore
