name: API Security and Automation CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  security-and-tests:
    name: Security Checks and Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: books_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d books_api_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: books_api_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_ISSUER: books-api
      JWT_AUDIENCE: books-api-client
      API_BASE_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Audit Node dependencies
        run: npm audit

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Audit NuGet dependencies
        run: dotnet list automation/BooksApi.Automation/BooksApi.Automation.csproj package --vulnerable --include-transitive

      - name: Run Jest security and CRUD tests
        run: npm test

      - name: Start API for C# tests
        run: |
          node server.js > /tmp/books-api.log 2>&1 &
          echo $! > /tmp/books-api.pid

          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:3000/books; then
              break
            fi
            sleep 1
          done

      - name: Run C# BDD security tests
        run: |
          export BOOKS_READER_TOKEN="$(node scripts/createToken.js reader)"
          export BOOKS_ADMIN_TOKEN="$(node scripts/createToken.js admin)"
          dotnet test automation/BooksApi.Automation/BooksApi.Automation.csproj --configuration Release

      - name: Upload API logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-logs
          path: /tmp/books-api.log
          if-no-files-found: ignore
